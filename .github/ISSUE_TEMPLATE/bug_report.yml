name: Bug report
description: Something BreadSched does wrongly, including a wrong financial result.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: >-
        **Do not attach or paste an unsanitized financial book, GnuCash file, bank
        statement, or screenshot showing real account numbers, balances, or
        transactions.** Describe the problem with neutral names and arbitrary amounts
        (`breadsched sample` creates a synthetic book to try it on). Report security
        problems privately instead (see SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: >-
        In your own words. It helps to say what you did, what you expected, and what
        you got instead.
      placeholder: |
        I did ...
        I expected ...
        Instead ...
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Version and system
      description: >-
        In the desktop application, Help → Report a Problem fills this in. Otherwise
        paste the output of `breadsched --version` and say which interface you used
        (desktop, browser, command line) and how you installed it.
      render: text
  - type: textarea
    id: log
    attributes:
      label: Error output
      description: >-
        If there was one: a traceback, the browser's correlation ID, or `--log-file`
        output, with any account names, amounts, and file paths replaced.
      render: text
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: This report contains no unsanitized financial data, book, statement, or screenshot of real accounts.
          required: true
