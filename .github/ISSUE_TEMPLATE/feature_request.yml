name: Feature request
description: A change to how BreadSched works, or something it should do.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: >-
        ROADMAP.md lists what is already planned. Describe the household situation
        with neutral names and arbitrary amounts, never real financial data.
  - type: textarea
    id: request
    attributes:
      label: What you are trying to do
      description: >-
        The financial task or situation, what BreadSched does today, and what would
        help. Say which interface matters if only one does.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: This request contains no unsanitized financial data, book, statement, or screenshot of real accounts.
          required: true
