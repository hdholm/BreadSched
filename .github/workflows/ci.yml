name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  contributor-policy:
    name: DCO sign-off
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Verify every commit author signed off
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          CHECKER_REF="$BASE_SHA"
          if ! git cat-file -e "$CHECKER_REF:scripts/check_commit_trailers.py"; then
            CHECKER_REF="$HEAD_SHA"
          fi
          git show "$CHECKER_REF:scripts/check_commit_trailers.py" > "$RUNNER_TEMP/check_commit_trailers.py"
          python "$RUNNER_TEMP/check_commit_trailers.py" "$BASE_SHA" "$HEAD_SHA" "$CHECKER_REF"

  test:
    name: Test on ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The core is standard-library only, so it must pass everywhere the
        # application claims to run. No GTK is installed here on purpose: if the
        # suite needs a display, the layering has been broken.
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests examples scripts packaging

      - name: Check formatting
        run: ruff format --check src tests examples scripts packaging

      - name: Type check
        run: mypy src/breadsched/gen src/breadsched/plugins tests/typecheck

      - name: Type check CLI, web and GUI
        run: make typecheck-extended

      - name: Test core in parallel
        run: pytest -n auto -m "not gui and not performance" --cov=breadsched --cov-report=term-missing

      - name: Run the demo end to end
        run: python examples/demo.py


  performance:
    name: Realistic-book performance guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Guard incremental commit performance
        run: pytest -n 0 -m performance

  gnucash-writeback:
    name: GnuCash write-back in real GnuCash
    # Books written back are opened by GnuCash itself (its Python bindings), so a
    # write GnuCash would reject or misread fails here rather than for a user.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install GnuCash, its Python bindings, and the SQLite driver
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gnucash libdbd-sqlite3
          /usr/bin/python3 -c "import gnucash; print(gnucash.__file__)"
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Write back to SQLite and XML books and open them in GnuCash
        env:
          BREADSCHED_GNUCASH_PYTHON: /usr/bin/python3
          BREADSCHED_REQUIRE_GNUCASH: "1"
        run: pytest -n 0 tests/test_gnucash_writeback_real.py tests/test_gnucash_writeback.py -v

  mutation:
    name: Bounded money mutation baseline
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install focused mutation dependencies
        run: |
          python -m pip install -e ".[dev]"
          python -m pip install 'mutmut==3.8.0'
      - name: Run fresh measured mutation slice
        run: python scripts/check_mutation_baseline.py

  package:
    name: Build and install distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install build frontend
        run: python -m pip install --upgrade pip build

      - name: Build sdist and wheel
        run: python -m build

      - name: Install the wheel, not the source tree
        shell: bash
        run: |
          cd "${RUNNER_TEMP}"
          python -m pip install "${GITHUB_WORKSPACE}"/dist/*.whl
          python - <<'PY'
          from importlib.resources import files
          import breadsched

          css = files("breadsched").joinpath("gui/resources/style.css")
          assert css.is_file(), css
          assert css.read_text(encoding="utf-8").strip(), css
          assert breadsched.__file__ is not None
          print(breadsched.__file__)
          print(css)
          PY
          breadsched --help >/dev/null

  windows-installer:
    name: Build and test Windows installer
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v7
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-python-pip
            mingw-w64-ucrt-x86_64-python-setuptools
            mingw-w64-ucrt-x86_64-python-wheel
            mingw-w64-ucrt-x86_64-python-gobject
            mingw-w64-ucrt-x86_64-python-cairo
            mingw-w64-ucrt-x86_64-gtk4
            mingw-w64-ucrt-x86_64-librsvg
            mingw-w64-ucrt-x86_64-adwaita-icon-theme
            mingw-w64-ucrt-x86_64-nsis

      - name: Build the installer
        run: packaging/windows/build-installer.sh dist/windows

      - name: Install, exercise, upgrade, and uninstall outside MSYS2
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $installer = Get-ChildItem dist/windows/BreadSched-*-setup.exe | Select-Object -First 1
          $version = $installer.Name -replace '^BreadSched-(.+)-setup\.exe$', '$1'
          # Upgrade from the newest published installer, verified against its SHA256SUMS.
          $previous = ./packaging/windows/fetch-previous.ps1 $version previous-release
          ./packaging/windows/test-installer.ps1 $installer.FullName -Previous "$previous"
          ./packaging/windows/stage-release.ps1 $installer.FullName release-installer

      - name: Check the staged release checksum the way the publisher does
        run: |
          cd release-installer
          ls
          line=$(cat BreadSched-*-setup.exe.sha256)
          [[ "$line" =~ ^[0-9a-f]{64}\ \ BreadSched-[0-9.a]+-setup\.exe$ ]]
          test "$(wc -l < BreadSched-*-setup.exe.sha256)" -eq 1
          sha256sum --check BreadSched-*-setup.exe.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: breadsched-windows-installer
          path: |
            dist/windows/BreadSched-*-setup.exe
            dist/windows/BreadSched-*-setup.exe.sha256
          if-no-files-found: error

  flatpak-smoke:
    name: Build and smoke-test Flatpak sandbox
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Flatpak builder
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder xvfb desktop-file-utils appstream
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo

      - name: Validate desktop entry and AppStream metadata
        run: |
          desktop-file-validate data/org.breadsched.BreadSched.desktop
          appstreamcli validate --no-net data/org.breadsched.BreadSched.metainfo.xml

      - name: Build package with GNOME SDK
        run: |
          flatpak-builder --user --install-deps-from=flathub --force-clean \
            --repo="$RUNNER_TEMP/flatpak-repo" "$RUNNER_TEMP/flatpak-build" \
            org.breadsched.BreadSched.json

      - name: Install package and smoke-test commands inside sandbox
        run: |
          flatpak remote-add --user --no-gpg-verify local-breadsched "$RUNNER_TEMP/flatpak-repo"
          flatpak install --user --noninteractive local-breadsched org.breadsched.BreadSched
          flatpak run --user --command=breadsched org.breadsched.BreadSched --version
          flatpak run --user org.breadsched.BreadSched --help

      - name: Exercise offline book and file workflows in sandbox
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.config" "$HOME/Documents"
          printf 'XDG_DOCUMENTS_DIR="$HOME/Documents"\n' > "$HOME/.config/user-dirs.dirs"
          export XDG_DOCUMENTS_DIR="$HOME/Documents"
          work_dir=$(mktemp -d "$HOME/Documents/breadsched-flatpak.XXXXXX")
          trap 'rm -rf "$work_dir"' EXIT
          app=org.breadsched.BreadSched
          book="$work_dir/sample.breadsched"
          backup="$work_dir/sample.backup"
          restored="$work_dir/restored.breadsched"
          imported="$work_dir/imported.breadsched"
          source="$work_dir/checking.qif"

          run_offline() {
            flatpak run --user --unshare=network --command=breadsched "$app" "$@"
          }

          flatpak run --user --unshare=network --command=python3 "$app" -c '
          import os
          import sys
          print("sandbox Documents:", os.environ.get("XDG_DOCUMENTS_DIR"))
          visible = os.path.isdir(sys.argv[1])
          print("workflow directory visible:", visible)
          assert visible, f"Documents directory is not exposed inside Flatpak: {sys.argv[1]}"
          ' "$work_dir"
          run_offline sample "$book" --as-of 2026-09-15
          run_offline verify "$book"
          run_offline dashboard "$book" --as-of 2026-09-15 --json > "$work_dir/dashboard.json"
          python3 - "$work_dir/dashboard.json" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as result:
              board = json.load(result)
          assert board["summary"]["net_worth"] is not None
          assert board["bills"]
          PY
          run_offline export "$book" "$work_dir/transactions.csv"
          test -s "$work_dir/transactions.csv"
          run_offline backup "$book" "$backup"
          run_offline restore "$backup" "$restored"
          run_offline verify "$restored"

          marker="$work_dir/writer-ready"
          flatpak run --user --unshare=network --command=python3 "$app" -c '
          import sys
          import time
          from pathlib import Path
          from breadsched.gen.db.sqlite import DbSQLite

          db = DbSQLite()
          db.load(sys.argv[1])
          try:
              Path(sys.argv[2]).write_text("ready", encoding="utf-8")
              time.sleep(12)
          finally:
              db.close()
          ' "$book" "$marker" &
          holder=$!
          for _ in {1..60}; do
            test -f "$marker" && break
            sleep 0.2
          done
          test -f "$marker"
          if output=$(run_offline add "$book" --description "Second writer" \
            --from Checking --to Groceries --amount 1 2>&1); then
            echo "A second sandbox process wrote to a locked book" >&2
            exit 1
          fi
          case "$output" in
            *"already open for writing"*) ;;
            *) echo "$output" >&2; exit 1 ;;
          esac
          run_offline dashboard "$book" --as-of 2026-09-15 --json > /dev/null
          wait "$holder"

          cat > "$source" <<'QIF'
          !Account
          NChecking
          TBank
          ^
          !Type:Bank
          D01/15/2026
          T-12.50
          PExample shop
          LGroceries
          ^
          QIF
          run_offline init "$imported"
          run_offline import "$imported" "$source" --no-infer
          run_offline verify "$imported"

      - name: Drive the GTK interface offline inside the sandbox
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.config" "$HOME/Documents"
          printf 'XDG_DOCUMENTS_DIR="$HOME/Documents"\n' > "$HOME/.config/user-dirs.dirs"
          app=org.breadsched.BreadSched
          exports="$HOME/.local/share/flatpak/exports/share"
          test -f "$exports/applications/$app.desktop"
          test -f "$exports/metainfo/$app.metainfo.xml"
          test -f "$exports/icons/hicolor/scalable/apps/$app.svg"
          work_dir=$(mktemp -d "$HOME/Documents/breadsched-gtk.XXXXXX")
          trap 'rm -rf "$work_dir"' EXIT
          cp scripts/flatpak_gtk_smoke.py "$work_dir/"
          flatpak run --user --unshare=network --command=breadsched "$app" \
            sample "$work_dir/gtk.breadsched" --as-of 2026-09-15
          xvfb-run -a flatpak run --user --unshare=network --env=GSK_RENDERER=cairo \
            --command=python3 "$app" \
            "$work_dir/flatpak_gtk_smoke.py" "$work_dir/gtk.breadsched" "$work_dir/report.json"
          python3 - "$work_dir/report.json" "$app" "$work_dir/gtk.breadsched" <<'PY'
          import json
          import os
          import sys

          with open(sys.argv[1], encoding="utf-8") as source:
              report = json.load(source)
          app, book = sys.argv[2], sys.argv[3]
          assert report["icon"] is True
          assert {"dashboard", "register", "plan", "projection"} <= set(report["views"])
          assert report["guide_characters"] > 1000
          expected = os.path.expanduser(f"~/.var/app/{app}/config/breadsched/settings.ini")
          assert report["settings_path"] == expected, report["settings_path"]
          assert os.path.isfile(expected), expected
          assert report["last_book_path"] == os.path.realpath(book), report["last_book_path"]
          PY

  missing-gtk-runtime:
    name: PyGObject without GTK4 typelib
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install PyGObject without GTK4
        run: |
          sudo apt-get update
          sudo apt-get remove -y gir1.2-gtk-4.0 || true
          sudo apt-get install -y python3-gi python3-venv
          /usr/bin/python3 -m venv --system-site-packages .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/pip install -e ".[dev]"
          .venv/bin/python - <<'PY'
          import gi

          try:
              gi.require_version("Gtk", "4.0")
          except ValueError:
              pass
          else:
              raise AssertionError("GTK4 typelib is unexpectedly importable")
          PY

      - name: Help, version, and launch failure stay usable
        run: |
          .venv/bin/pytest -n 0 tests/test_launcher.py
          .venv/bin/breadsched-gtk --help >/dev/null
          .venv/bin/breadsched-gtk --version >/dev/null
          book="${RUNNER_TEMP}/missing-gtk.breadsched"
          .venv/bin/breadsched init "$book" >/dev/null
          set +e
          output=$(.venv/bin/breadsched-gtk "$book" 2>&1)
          status=$?
          set -e
          test "$status" -eq 3
          case "$output" in
            *Traceback*) exit 1 ;;
          esac
          case "$output" in
            *"GTK 4 and PyGObject"*) ;;
            *) exit 1 ;;
          esac

  gui:
    name: GTK4 interface
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install GTK4, PyGObject and cairo
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi python3-gi-cairo python3-cairo \
                                  python3-venv gir1.2-gtk-4.0 libgtk-4-1 \
                                  xvfb dbus-x11
          /usr/bin/python3 -m venv --system-site-packages .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/pip install -e ".[dev]"
          .venv/bin/python -c "import gi, cairo; print(gi.__file__); print(cairo.__file__)"

      - name: Import every GUI module
        # Catches a relative import that resolves to nothing, which no compile
        # check can see. This is how `from ..gen` in views/_base.py escaped once.
        run: |
          .venv/bin/python - <<'PY'
          import importlib, pkgutil, sys
          import breadsched.gui
          failed = {}
          for module in pkgutil.walk_packages(breadsched.gui.__path__, "breadsched.gui."):
              try:
                  importlib.import_module(module.name)
              except Exception as exc:
                  failed[module.name] = f"{type(exc).__name__}: {exc}"
          for name, error in failed.items():
              print(f"FAIL {name}: {error}")
          sys.exit(1 if failed else 0)
          PY

      - name: Build and drive every view under a virtual display
        run: xvfb-run -a .venv/bin/pytest -m gui -v

      - name: Repeat with a session bus present
        # A CI runner has no D-Bus session, but a developer's desktop does, and
        # GApplication behaves differently when it can export itself on the bus.
        # Without this step that difference is only ever found by a user.
        run: dbus-run-session -- xvfb-run -a .venv/bin/pytest -m gui

      - name: Full suite with a display present
        run: xvfb-run -a .venv/bin/pytest
