name: Live quote sources

# The online quote tests reach tsp.gov, the ECB, Alpha Vantage, and Finance::Quote's
# sources. Those services change and fail on their own schedule, so the tests run
# here weekly and on demand instead of gating pull requests; a failure here means a
# source changed its format or address, or BreadSched broke reading it.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    # Finance::Quote's current CPAN release decides the result. Ubuntu's package
    # (1.59 on 24.04) runs too, so its state stays visible, but cannot fail the
    # run: in October 2026 every keyless US stock source refused it while 1.71
    # passed, and the guide tells users of old packages to update.
    name: Fetch from every quote source (Finance::Quote ${{ matrix.finance-quote }})
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.finance-quote == 'distribution' }}
    strategy:
      fail-fast: false
      matrix:
        finance-quote: [distribution, cpan]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Finance::Quote and BreadSched
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libfinance-quote-perl
          if [ "${{ matrix.finance-quote }}" = cpan ]; then
            sudo apt-get install -y --no-install-recommends cpanminus libssl-dev zlib1g-dev
            sudo cpanm --notest --quiet Finance::Quote
          fi
          perl -MFinance::Quote -e 'print "Finance::Quote $Finance::Quote::VERSION\n"'
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run the live quote tests
        env:
          BREADSCHED_NETWORK_TESTS: "1"
          # Optional: without it Alpha Vantage uses its demo key (IBM only).
          ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
        run: pytest -m network tests/test_online_quotes_live.py -rs
