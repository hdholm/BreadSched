name: Website

# Builds the website (website/ and the packaged user guide) and publishes it with
# GitHub Pages. The repository's Pages source must be set to "GitHub Actions".
on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "src/breadsched/USER_GUIDE.md"
      - "src/breadsched/guide/**"
      - "src/breadsched/user_guide.py"
      - "CHANGELOG.md"
      - "ROADMAP.md"
      - "scripts/build_site.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build the site
        run: python scripts/build_site.py _site
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
