name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read

jobs:
  prepare:
    name: Build tested main without write access
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    outputs:
      selected: ${{ steps.release.outputs.selected }}
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: main

      - name: Require the tested main checkout before running source code
        env:
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          [[ "$TESTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$TESTED_SHA"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Select an explicitly documented release
        id: release
        shell: bash
        run: |
          version=$(PYTHONPATH=src python -c 'from breadsched import __version__; print(__version__)')
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(a[0-9]+)?$ ]]
          tag="v${version}"
          notes="docs/releases/${tag}.md"
          if [[ ! -f "$notes" ]]; then
            echo "No release notes for ${tag}; this tested version is not selected for release."
            echo "selected=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch origin main --tags
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          # A later main commit that keeps an already-released version (for example
          # documentation or CI work) is not a new release. Only the tagged commit
          # itself may be re-published; never move or duplicate an existing tag.
          if tagged=$(git rev-parse -q --verify "refs/tags/${tag}^{commit}"); then
            if [[ "$tagged" != "$(git rev-parse HEAD)" ]]; then
              echo "${tag} is already tagged at ${tagged}; advance the application version to select a new release."
              echo "selected=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          python scripts/check_release_notes.py "$tag" "$notes"
          echo "selected=true" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Build and smoke-test release artifacts
        if: steps.release.outputs.selected == 'true'
        shell: bash
        run: |
          python -m pip install --upgrade pip build
          python -m build
          # The installed wheel must report exactly what the tested source does:
          # the application version and its native-schema window, never a
          # hard-coded schema that goes stale when the schema advances.
          expected=$(PYTHONPATH=src python -c 'from breadsched.versioning import version_summary; print(version_summary())')
          case "$expected" in
            "breadsched ${{ steps.release.outputs.version }} (native schema "*) ;;
            *) echo "source reports an unexpected version: $expected"; exit 1 ;;
          esac
          cd "$RUNNER_TEMP"
          python -m pip install "${GITHUB_WORKSPACE}"/dist/*.whl
          actual=$(breadsched --version)
          if [[ "$actual" != "$expected" ]]; then
            echo "installed wheel reports '$actual', expected '$expected'"
            exit 1
          fi
          cd "$GITHUB_WORKSPACE/dist"
          sha256sum * > ../SHA256SUMS
          sha256sum --check ../SHA256SUMS

      - name: Transfer only release inputs as data
        if: steps.release.outputs.selected == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: release-inputs
          path: |
            dist/*.whl
            dist/*.tar.gz
            SHA256SUMS
            docs/releases/${{ steps.release.outputs.tag }}.md
          if-no-files-found: error
          retention-days: 1

  windows-installer:
    name: Build and test the Windows installer for release
    needs: prepare
    if: needs.prepare.outputs.selected == 'true'
    runs-on: windows-latest
    # A silent installer that waits forever must fail the job, not hold it for hours.
    timeout-minutes: 30
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: main

      - name: Require the tested main checkout before running source code
        shell: pwsh
        run: |
          if ($env:TESTED_SHA -notmatch '^[0-9a-f]{40}$') { throw "bad tested SHA" }
          if ((git rev-parse HEAD) -ne $env:TESTED_SHA) { throw "main moved after testing" }

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-python-pip
            mingw-w64-ucrt-x86_64-python-setuptools
            mingw-w64-ucrt-x86_64-python-wheel
            mingw-w64-ucrt-x86_64-python-gobject
            mingw-w64-ucrt-x86_64-python-cairo
            mingw-w64-ucrt-x86_64-gtk4
            mingw-w64-ucrt-x86_64-librsvg
            mingw-w64-ucrt-x86_64-adwaita-icon-theme
            mingw-w64-ucrt-x86_64-nsis

      - name: Provide NSIS plugins
        # MSYS2's NSIS 3.13 package carries no plugins; the official build does.
        shell: pwsh
        run: choco install nsis --no-progress -y

      - name: Build the installer
        run: packaging/windows/build-installer.sh dist/windows

      - name: Install, exercise, upgrade, and uninstall outside MSYS2
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $name = "BreadSched-$env:VERSION-setup.exe"
          $installer = Join-Path "dist/windows" $name
          if (-not (Test-Path $installer)) { throw "expected $name for the selected version" }
          # Upgrade from the newest published installer, verified against its SHA256SUMS.
          $previous = ./packaging/windows/fetch-previous.ps1 $env:VERSION previous-release
          ./packaging/windows/test-installer.ps1 $installer -Previous "$previous"
          ./packaging/windows/stage-release.ps1 $installer release-installer

      - name: Transfer only the tested installer as data
        uses: actions/upload-artifact@v4
        with:
          name: release-installer
          path: release-installer/
          if-no-files-found: error
          retention-days: 1

  flatpak-bundle:
    name: Build and test the Flatpak bundle for release
    needs: prepare
    if: needs.prepare.outputs.selected == 'true'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: main

      - name: Require the tested main checkout before running source code
        shell: bash
        run: |
          [[ "$TESTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$TESTED_SHA"

      - name: Install Flatpak builder
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo

      - name: Build the bundle
        shell: bash
        run: |
          flatpak-builder --user --install-deps-from=flathub --force-clean \
            --repo="$RUNNER_TEMP/flatpak-repo" "$RUNNER_TEMP/flatpak-build" \
            org.breadsched.BreadSched.json
          mkdir -p release-flatpak
          # The bundle names Flathub as the source of its GNOME runtime, so
          # installing it fetches the runtime once and updates it from there.
          flatpak build-bundle \
            --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo \
            "$RUNNER_TEMP/flatpak-repo" "release-flatpak/BreadSched-${VERSION}.flatpak" \
            org.breadsched.BreadSched

      - name: Install the bundle and check the installed version
        shell: bash
        run: |
          bundle="release-flatpak/BreadSched-${VERSION}.flatpak"
          flatpak install --user --noninteractive --bundle "$bundle"
          actual=$(flatpak run --user --command=breadsched org.breadsched.BreadSched --version)
          case "$actual" in
            "breadsched ${VERSION} (native schema "*) ;;
            *) echo "installed bundle reports '$actual'"; exit 1 ;;
          esac
          cd release-flatpak
          sha256sum "BreadSched-${VERSION}.flatpak" > "BreadSched-${VERSION}.flatpak.sha256"
          sha256sum --check "BreadSched-${VERSION}.flatpak.sha256"

      - name: Transfer only the tested bundle as data
        uses: actions/upload-artifact@v4
        with:
          name: release-flatpak
          path: release-flatpak/
          if-no-files-found: error
          retention-days: 1

  linux-packages:
    name: Build and test the ${{ matrix.format }} package for release
    needs: prepare
    if: needs.prepare.outputs.selected == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - format: deb
            image: ubuntu:24.04
          - format: rpm
            image: fedora:latest
    container: ${{ matrix.image }}
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Install build tools
        shell: bash
        run: |
          if command -v apt-get >/dev/null; then
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
              ca-certificates git python3 python3-pip
          else
            dnf install -y git python3 python3-pip rpm-build
          fi

      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: main

      - name: Require the tested main checkout before running source code
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          [[ "$TESTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$TESTED_SHA"

      - uses: actions/download-artifact@v4
        with:
          name: release-inputs
          path: release-inputs

      - name: Package the tested wheel, install it, and check it
        shell: bash
        run: |
          wheel="release-inputs/dist/breadsched-${VERSION}-py3-none-any.whl"
          test -f "$wheel"
          mkdir -p release-linux
          file=$(bash packaging/linux/build-package.sh "${{ matrix.format }}" "$wheel" release-linux)
          if [ "${{ matrix.format }}" = deb ]; then
            DEBIAN_FRONTEND=noninteractive apt-get install -y "./$file"
          else
            dnf install -y "./$file"
          fi
          (cd /tmp && PATH=/usr/bin:/bin bash "$GITHUB_WORKSPACE/packaging/linux/smoke-test.sh" "$VERSION")
          cd release-linux
          name=$(basename "$file")
          sha256sum "$name" > "$name.sha256"
          sha256sum --check "$name.sha256"

      - name: Transfer only the tested package as data
        uses: actions/upload-artifact@v4
        with:
          name: release-linux-${{ matrix.format }}
          path: release-linux/
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Tag and publish verified artifacts
    needs: [prepare, windows-installer, flatpak-bundle, linux-packages]
    if: needs.prepare.outputs.selected == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      TAG: ${{ needs.prepare.outputs.tag }}
      CANDIDATE_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Verify tested main identity
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(a[0-9]+)?$ ]]
          test "$TAG" = "v${VERSION}"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')" = "$CANDIDATE_SHA"

      - uses: actions/download-artifact@v4
        with:
          name: release-inputs
          path: release-inputs

      - uses: actions/download-artifact@v4
        with:
          name: release-installer
          path: release-inputs/installer

      - uses: actions/download-artifact@v4
        with:
          name: release-flatpak
          path: release-inputs/flatpak

      - uses: actions/download-artifact@v4
        with:
          name: release-linux-deb
          path: release-inputs/linux

      - uses: actions/download-artifact@v4
        with:
          name: release-linux-rpm
          path: release-inputs/linux

      - name: Validate transferred files without executing them
        shell: bash
        run: |
          cd release-inputs
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          version = os.environ["VERSION"]
          tag = os.environ["TAG"]
          names = {
              f"breadsched-{version}-py3-none-any.whl",
              f"breadsched-{version}.tar.gz",
          }
          notes = Path("docs/releases") / f"{tag}.md"
          assets = list(Path("dist").iterdir())
          checksum = Path("SHA256SUMS")
          assert notes.is_file() and not notes.is_symlink()
          assert {p.name for p in assets} == names
          assert all(p.is_file() and not p.is_symlink() for p in assets)
          assert checksum.is_file() and not checksum.is_symlink()
          lines = checksum.read_text(encoding="utf-8").splitlines()
          matches = [re.fullmatch(r"([0-9a-f]{64})  (.+)", line) for line in lines]
          assert len(matches) == 2 and all(matches)
          assert {match.group(2) for match in matches} == names

          # The Windows installer, built and tested on Windows from the same commit.
          setup = f"BreadSched-{version}-setup.exe"
          installer = list(Path("installer").iterdir())
          assert {p.name for p in installer} == {setup, f"{setup}.sha256"}
          assert all(p.is_file() and not p.is_symlink() for p in installer)
          line = Path("installer", f"{setup}.sha256").read_text(encoding="utf-8")
          assert re.fullmatch(r"[0-9a-f]{64}  " + re.escape(setup) + r"\n", line)

          # The Flatpak bundle, built and installed from the same commit.
          bundle = f"BreadSched-{version}.flatpak"
          flatpak = list(Path("flatpak").iterdir())
          assert {p.name for p in flatpak} == {bundle, f"{bundle}.sha256"}
          assert all(p.is_file() and not p.is_symlink() for p in flatpak)
          line = Path("flatpak", f"{bundle}.sha256").read_text(encoding="utf-8")
          assert re.fullmatch(r"[0-9a-f]{64}  " + re.escape(bundle) + r"\n", line)

          # The Debian/Ubuntu and Fedora packages, built from the same wheel and installed.
          packages = {f"breadsched_{version}_all.deb", f"breadsched-{version}-1.noarch.rpm"}
          linux = list(Path("linux").iterdir())
          assert {p.name for p in linux} == packages | {f"{name}.sha256" for name in packages}
          assert all(p.is_file() and not p.is_symlink() for p in linux)
          for name in packages:
              line = Path("linux", f"{name}.sha256").read_text(encoding="utf-8")
              assert re.fullmatch(r"[0-9a-f]{64}  " + re.escape(name) + r"\n", line)
          PY
          cd dist
          sha256sum --check ../SHA256SUMS
          cd ../installer
          sha256sum --check "BreadSched-${VERSION}-setup.exe.sha256"
          cd ../flatpak
          sha256sum --check "BreadSched-${VERSION}.flatpak.sha256"
          cd ../linux
          sha256sum --check "breadsched_${VERSION}_all.deb.sha256" \
            "breadsched-${VERSION}-1.noarch.rpm.sha256"
          # SHA256SUMS then covers every published file.
          cat "../installer/BreadSched-${VERSION}-setup.exe.sha256" \
            "../flatpak/BreadSched-${VERSION}.flatpak.sha256" \
            "breadsched_${VERSION}_all.deb.sha256" \
            "breadsched-${VERSION}-1.noarch.rpm.sha256" >> ../SHA256SUMS

      - name: Create or verify the accepted-main tag
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          test "$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')" = "$CANDIDATE_SHA"
          if existing=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" --jq '.object.type + " " + .object.sha' 2>/dev/null); then
            read -r kind object_sha <<< "$existing"
            if [[ "$kind" == "tag" ]]; then
              object_sha=$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${object_sha}" --jq '.object.sha')
            else
              test "$kind" = "commit"
            fi
            test "$object_sha" = "$CANDIDATE_SHA"
          else
            tag_object=$(gh api -X POST "repos/${GITHUB_REPOSITORY}/git/tags" \
              -f tag="$TAG" -f message="BreadSched $TAG" \
              -f object="$CANDIDATE_SHA" -f type=commit --jq '.sha')
            gh api -X POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref="refs/tags/$TAG" -f sha="$tag_object"
          fi

      - name: Publish release and verified artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; leaving it unchanged."
            exit 0
          fi
          test "$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')" = "$CANDIDATE_SHA"
          cd release-inputs
          release_flags=()
          if [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+a[0-9]+$ ]]; then
            release_flags+=(--prerelease)
          fi
          gh release create "$TAG" \
            "dist/breadsched-${VERSION}-py3-none-any.whl" \
            "dist/breadsched-${VERSION}.tar.gz" \
            "installer/BreadSched-${VERSION}-setup.exe" \
            "flatpak/BreadSched-${VERSION}.flatpak" \
            "linux/breadsched_${VERSION}_all.deb" \
            "linux/breadsched-${VERSION}-1.noarch.rpm" SHA256SUMS "${release_flags[@]}" \
            --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "BreadSched $TAG" \
            --notes-file "docs/releases/${TAG}.md"
