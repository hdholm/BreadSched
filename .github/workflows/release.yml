name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: write

jobs:
  publish:
    name: Tag tested main and publish artifacts
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Select an explicitly documented release
        id: release
        shell: bash
        run: |
          version=$(PYTHONPATH=src python -c 'from breadsched import __version__; print(__version__)')
          tag="v${version}"
          notes="docs/releases/${tag}.md"
          if [[ ! -f "$notes" ]]; then
            echo "No release notes for ${tag}; this tested alpha is not selected for release."
            echo "selected=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch origin main --tags
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          python scripts/check_release_notes.py "$tag" "$notes"
          echo "selected=true" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "notes=$notes" >> "$GITHUB_OUTPUT"

      - name: Reject conflicting or already-published tags
        if: steps.release.outputs.selected == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists; leaving it unchanged."
            echo "already_published=true" >> "$GITHUB_ENV"
            exit 0
          fi
          if git rev-parse --verify "refs/tags/${TAG}" >/dev/null 2>&1; then
            test "$(git rev-list -n 1 "$TAG")" = "$(git rev-parse HEAD)"
          fi

      - name: Build and smoke-test release artifacts
        if: >-
          steps.release.outputs.selected == 'true' &&
          env.already_published != 'true'
        shell: bash
        run: |
          python -m pip install --upgrade pip build
          python -m build
          cd "$RUNNER_TEMP"
          python -m pip install "${GITHUB_WORKSPACE}"/dist/*.whl
          actual=$(breadsched --version)
          case "$actual" in
            *"${{ steps.release.outputs.version }}"*"native schema 7"*"supports 6–7"*) ;;
            *) echo "unexpected installed version report: $actual"; exit 1 ;;
          esac
          cd "$GITHUB_WORKSPACE"
          cd dist
          sha256sum * > ../SHA256SUMS
          sha256sum --check ../SHA256SUMS

      - name: Create the accepted-main tag
        if: >-
          steps.release.outputs.selected == 'true' &&
          env.already_published != 'true'
        env:
          TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          if ! git rev-parse --verify "refs/tags/${TAG}" >/dev/null 2>&1; then
            git tag -a "$TAG" -m "BreadSched $TAG"
            git push origin "refs/tags/${TAG}"
          fi

      - name: Publish release and verified artifacts
        if: >-
          steps.release.outputs.selected == 'true' &&
          env.already_published != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          NOTES: ${{ steps.release.outputs.notes }}
        shell: bash
        run: |
          gh release create "$TAG" dist/* SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "BreadSched $TAG" \
            --notes-file "$NOTES"
